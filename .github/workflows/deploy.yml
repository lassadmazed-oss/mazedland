name: Deploy

# Ships main to production on Vercel. The Vercel project lives in the
# lassadmazed-2177 account and the repo on lassadmazed-oss; Vercel's own Git
# integration can't link the two, so the deploy runs from here with the CLI.
# It uploads the checkout and Vercel builds it with the project's production
# env vars, the same build a Git-triggered deploy would run.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One production deploy at a time, in merge order; never cancel one midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The team that holds the project: « lassad-757960fc » since 2026-11-03
      # (it was team_DNguYjDcPZfEF2PCrJH5zowJ, « lassad »). After a move, the
      # deploy fails with « Project not found »: put the new team id here.
      VERCEL_ORG_ID: team_rHVYh09RvuFbxkZ0WSpRXtEG
      VERCEL_PROJECT_ID: prj_OSokO1HZGeSV65w1IjyYujIRGqOZ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        run: npx --yes vercel@65.8.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
